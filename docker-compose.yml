version: '3.8'

services:
  bastion-waf:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bastion_waf
    ports:
      - "8080:8080" # WAF Reverse Proxy Gateway
    environment:
      - BASTION_HOST=0.0.0.0
      - BASTION_CONFIG=/app/waf/config/bastion.yaml
    volumes:
      - ./waf/config:/app/waf/config
      - ./waf/logs:/app/waf/logs
    depends_on:
      - opensearch
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: bastion_opensearch
    environment:
      - cluster.name=bastion-cluster
      - node.name=bastion-node
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_SECURITY_PLUGIN=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200" # OpenSearch REST Ingestion API
    restart: unless-stopped

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: bastion_opensearch_dashboards
    ports:
      - "5601:5601" # OpenSearch Dashboards Web UI (Port 5601)
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - "DISABLE_SECURITY_DASHBOARDS_PLUGIN=true"
    depends_on:
      - opensearch
    restart: unless-stopped

volumes:
  opensearch-data:
