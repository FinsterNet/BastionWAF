services:
  - type: web
    name: finsternet-waf
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: 10000
      - key: BASTION_HOST
        value: 0.0.0.0
      - key: BASTION_CONFIG
        value: /app/waf/config/bastion.yaml
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: BASTION_ADMIN_USER
        value: admin
      - key: BASTION_ADMIN_PASSWORD
        value: "@Robelshitahun7"
      - key: DATABASE_URL
        fromDatabase:
          name: bastion-postgres
          property: connectionString

databases:
  - name: bastion-postgres
    databaseName: bastion
    user: bastion_user
    plan: free
    region: oregon
