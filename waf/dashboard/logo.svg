<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background tile gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F1535"/>
      <stop offset="100%" stop-color="#060B26"/>
    </linearGradient>

    <!-- Sleek border gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(0, 117, 255, 0.6)"/>
      <stop offset="50%" stop-color="rgba(44, 217, 255, 0.3)"/>
      <stop offset="100%" stop-color="rgba(121, 40, 202, 0.4)"/>
    </linearGradient>

    <!-- Base B gradient (Spine & Bottom loop) -->
    <linearGradient id="baseBGrad" x1="14" y1="14" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0075FF"/>
      <stop offset="60%" stop-color="#0056B3"/>
      <stop offset="100%" stop-color="#003D82"/>
    </linearGradient>

    <!-- Rising Arrow gradient (Bright, dynamic, forward-trending) -->
    <linearGradient id="arrowGrad" x1="18" y1="36" x2="52" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0075FF"/>
      <stop offset="35%" stop-color="#2CD9FF"/>
      <stop offset="75%" stop-color="#70E2FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Soft drop shadow for ribbon layering -->
    <filter id="ribbonShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Glow for the arrow tip -->
    <filter id="arrowGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#2CD9FF" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Container App Tile -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Ambient light in upper right -->
  <circle cx="48" cy="16" r="16" fill="#2CD9FF" opacity="0.18" filter="blur(6px)"/>

  <!-- SHAPE 1: Left Spine of "B" -->
  <rect x="14" y="14" width="8" height="36" rx="4" fill="url(#baseBGrad)"/>

  <!-- SHAPE 2: Bottom Loop of "B" with authentic cutout counter -->
  <path fill-rule="evenodd" clip-rule="evenodd"
        d="M 20 29
           H 35
           C 42.5 29, 47.5 33.5, 47.5 39.5
           C 47.5 45.5, 42.5 50, 35 50
           H 20
           V 29
           Z
           M 22 35.5
           V 43.5
           H 34
           C 38 43.5, 40.5 41.8, 40.5 39.5
           C 40.5 37.2, 38 35.5, 34 35.5
           H 22
           Z"
        fill="url(#baseBGrad)"/>

  <!-- SHAPE 3: Dynamic Rising Arrow (Top section of "B") -->
  <!-- Symmetrical, geometric 45° arrowhead with smooth bezier trajectory -->
  <g filter="url(#ribbonShadow)">
    <path filter="url(#arrowGlow)"
          d="M 18 32
             C 24 32, 33 27, 40 20
             L 36 14
             L 50 14
             L 50 28
             L 44 24
             C 37 31, 28 38, 18 38
             Z"
          fill="url(#arrowGrad)"/>
  </g>

  <!-- Subtle glossy highlight accent at the arrow tip -->
  <circle cx="49" cy="15" r="1.5" fill="#ffffff" opacity="0.9"/>
</svg>
