<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slide 1 - BASTION WAF</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    width: 1920px;
    height: 1080px;
    background-color: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #1A1A1A;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-left: 140px;
    padding-right: 140px;
    position: relative;
    overflow: hidden;
  }

  .main-content {
    margin-top: -40px;
  }

  .title {
    font-size: 84px;
    font-weight: 800;
    letter-spacing: -0.01em;
    color: #1A1A1A;
    margin-bottom: 24px;
    text-transform: uppercase;
  }

  .subtitle {
    font-size: 32px;
    font-weight: 400;
    color: #4A5568;
    margin-bottom: 64px;
    letter-spacing: -0.01em;
  }

  .presenter-box {
    display: flex;
    align-items: center;
    gap: 32px;
  }

  .avatar-circle {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 3px solid #2F855A;
    background-color: #EEF7F2;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
    font-weight: 700;
    color: #2F855A;
    flex-shrink: 0;
  }

  .presenter-info {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .presenter-name {
    font-size: 34px;
    font-weight: 700;
    color: #1A1A1A;
    letter-spacing: -0.01em;
  }

  .presenter-role {
    font-size: 22px;
    font-weight: 500;
    color: #2F855A;
  }

  .presenter-dept {
    font-size: 19px;
    color: #718096;
  }

  .footer {
    position: absolute;
    bottom: 44px;
    left: 140px;
    right: 140px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 17px;
    color: #718096;
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>

  <div class="main-content">
    <h1 class="title">BASTION WAF</h1>
    <p class="subtitle">A tool that protects websites from hackers</p>

    <div class="presenter-box">
      <div class="avatar-circle">RS</div>
      <div class="presenter-info">
        <div class="presenter-name">Robel Shitahun</div>
        <div class="presenter-role">3rd Year Cybersecurity Student</div>
        <div class="presenter-dept">Faculty of Computing • Bahir Dar Institute of Technology (BiT)</div>
      </div>
    </div>
  </div>

  <div class="footer">
    <span>Bahir Dar Institute of Technology (BiT) • BiTec</span>
    <span>1</span>
  </div>
