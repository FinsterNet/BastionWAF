[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bastion-waf"
version = "1.0.0"
description = "Next-Generation Hybrid Web Application Firewall with Semantic Embedding Detection and OpenSearch SIEM Integration"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
    "flask>=3.0.0",
    "pytest>=8.0.0",
    "psutil>=5.9.0",
]

[tool.pytest.ini_options]
testpaths = ["waf/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
